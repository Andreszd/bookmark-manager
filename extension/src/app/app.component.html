<div class="app-container">
  <div class="px-1">
    <h1 class="p-3">Bookmark</h1>
    <div *ngIf="!(authService.isAuthenticated$ | async)" class="login-section">
      <button
        class="button w-full color-white bg-color-primary"
        (click)="login()"
      >
        Inicia sesión
      </button>
    </div>
  </div>
  <div *ngIf="authService.isAuthenticated$ | async" class="main-section">
    <app-main></app-main>
  </div>
</div>
