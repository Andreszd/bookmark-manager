<div
  #dropzone
  class="dropzone"
  [style]="hasOverlayElement && activeStyles ? activeStyles : unactiveStyles"
  [ngClass]="getClassesCSS()"
  (drop)="handleOnDrop($event)"
  (dragover)="handleOnDragOver($event)"
  (dragenter)="handleOnDragEnter($event)"
  (dragleave)="handleOnDragLeave($event)"
>
  <ng-content></ng-content>
</div>
