<div class="container flex f-direction-col justify-content-center">
  <div>
    <input
      (blur)="saveChanges($any($event.target).value)"
      (keydown)="catchEnter($event)"
      [defaultValue]="page.title"
      class="p-2 f-w-600 px-00 py-00 bg"
      [style]="{
        position: 'relative',
        zIndex: '100',
        backgroundColor: 'inherit'
      }"
    />
  </div>
  <div class="flex f-direction-col">
    <div>
      <input
        class="p-3 px-00 py-00"
        (blur)="saveChanges($any($event.target).value)"
        [defaultValue]="page.url"
        [style]="{
          position: 'relative',
          zIndex: '100',
          backgroundColor: 'inherit'
        }"
      />
    </div>
    <p *ngIf="!small" class="p-4">creado el</p>
  </div>
</div>
