<app-sidebar-link
  [class]="{
    'hover-bg-color-primary': !isEditing,
    'bg-color-grey-300': isEditing
  }"
>
  <svg
    icon
    class="icon-default-color"
    style="width: 20px; height: 20px"
    focusable="false"
    aria-hidden="true"
    viewBox="0 0 24 24"
  >
    <path
      d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8z"
    ></path>
  </svg>

  <p *ngIf="!isEditing" class="p-3" (dblclick)="enableEdition()">
    {{ group?.name }}
  </p>
  <form [formGroup]="form" *ngIf="isEditing" class="flex-1">
    <input #ref autofocus formControlName="name" (blur)="disableEdition()" />
  </form>
  <ng-content></ng-content>
</app-sidebar-link>
