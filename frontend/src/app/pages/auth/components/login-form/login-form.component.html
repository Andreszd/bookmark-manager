<div class="flex f-direction-col gap-3">
  <p class="p-0 text-align-center">Inicia sesión</p>
  <form
    [formGroup]="form"
    class="flex f-direction-col gap-4"
    (submit)="login()"
  >
    <div class="flex f-direction-col gap-1">
      <div class="flex f-direction-col gap-00">
        <label class="p-3">Email</label>
        <input formControlName="email" class="p-3 py-2" />
      </div>
      <div class="flex f-direction-col gap-00">
        <label class="p-3">Contraseña</label>
        <input formControlName="password" class="p-3 py-2" />
      </div>
    </div>

    <button
      class="button bg-color-primary color-white p-2 flex justify-content-center"
      [style]="{ fontWeight: '600' }"
    >
      <loading-spinner
        *ngIf="authService.isAuthenticating"
        size="30px"
      ></loading-spinner>
      <p
        *ngIf="!authService.isAuthenticating"
        class="w-full text-align-center py-0"
      >
        Iniciar sesión
      </p>
    </button>
    <div class="divider flex align-items-center gap-1">
      <span></span>
      ó
      <span></span>
    </div>
    <a
      [href]="signInMethodsService.getSignInUrl()"
      class="button py-2 flex justify-content-center"
    >
      <svg-loader class="icon" src="assets/google-icon.svg"></svg-loader>
      Inicia sesión con Google
    </a>
  </form>
</div>
