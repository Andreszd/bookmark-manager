<div class="h-full flex f-direction-col">
  <app-sidebar-section [style]="{ flex: '1' }">
    <app-sidebar-section-heading heading>
      Grupos
      <loading-spinner
        actions
        *ngIf="groupService.loading$ | async"
        size="20px"
        color="var(--grey-500)"
      ></loading-spinner>
      <button
        *ngIf="!(groupService.loading$ | async)"
        actions
        title="Añadir"
        class="button text color-grey-500"
        (click)="showForm()"
      >
        <svg
          class="icon"
          style="width: 20px"
          focusable="false"
          aria-hidden="true"
          viewBox="0 0 24 24"
        >
          <path
            d="M18 13h-5v5c0 .55-.45 1-1 1s-1-.45-1-1v-5H6c-.55 0-1-.45-1-1s.45-1 1-1h5V6c0-.55.45-1 1-1s1 .45 1 1v5h5c.55 0 1 .45 1 1s-.45 1-1 1"
          ></path>
        </svg>
      </button>
    </app-sidebar-section-heading>

    <div content class="w-full flex f-direction-col h-full">
      <group-sidebar-link
        [form]="true"
        (blur)="showGroupForm = false"
        (save)="createGroup($event)"
        *ngIf="showGroupForm"
      >
      </group-sidebar-link>

      <div
        *ngIf="!(groupService.groups$ | async)?.length"
        content
        class="flex f-direction-col justify-content-center h-full"
      >
        <empty-state>
          <div img class="color-primary" [style]="{ width: '200px' }">
            <svg-loader src="assets/without-group.svg"></svg-loader>
          </div>
          <p text class="p-4">Agrupa tus paginas creando grupos.</p>
        </empty-state>
      </div>
      <drop-zone
        *ngFor="let group of groupService.groups$ | async"
        [activeStyles]="{ backgroundColor: 'var(--grey-300)' }"
        [disabled]="dragAndDropService.activeDraggableItems.includes(group._id)"
        (onDrop)="handleDrop(group)"
      >
        <draggable-item
          [data]="group._id"
          (onDragStart)="dragAndDropService.handleDragStart(group._id, 'group')"
          (onDragEnd)="dragAndDropService.clean()"
        >
          <group-sidebar-link
            [group]="group"
            (save)="update(group._id, $event)"
          >
          </group-sidebar-link>
        </draggable-item>
      </drop-zone>
    </div>
  </app-sidebar-section>

  <!-- remove section -->
  <app-sidebar-section
    *ngIf="
      dragAndDropService.activeDraggableItems.length &&
      dragAndDropService.draggableItemType === 'group'
    "
  >
    <drop-zone
      content
      [activeStyles]="{
        backgroundColor: '#f2615f',
        color: 'white',
        borderRadius: '0'
      }"
      [unactiveStyles]="{
        borderRadius: '0',
        backgroundColor: 'var(--grey-500)',
        color: 'white'
      }"
      (onDrop)="remove($event)"
    >
      <div
        class="flex f-direction-col justify-content-center align-items-center gap-0 py-2"
      >
        <svg
          class="icon"
          style="width: 40px"
          focusable="false"
          aria-hidden="true"
          viewBox="0 0 24 24"
        >
          <path
            d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"
          ></path>
        </svg>
        <p class="p-2">Eliminar</p>
      </div>
    </drop-zone>
  </app-sidebar-section>
</div>
