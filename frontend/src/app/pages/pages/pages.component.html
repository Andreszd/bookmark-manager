<div class="flex f-direction-col gap-1 flex-1 h-full">
  <pages-list-heading></pages-list-heading>

  <div
    *ngIf="!(pageService.pagesLength$ | async)"
    class="h-full flex f-direction-col justify-content-center"
  >
    <empty-state>
      <div img [style]="{ width: '200px' }" class="color-primary">
        <svg-loader src="assets/without-pages.svg"> </svg-loader>
      </div>
      <p text>No tienes paginas guardadas, empieza añadiendo uno.</p>
    </empty-state>
  </div>

  <drag-select-container
    *ngIf="pageService.pagesLength$ | async"
    class="flex f-wrap f-direction-col gap-1 align-items-start align-content-start px-2"
    [ngClass]="{ 'f-direction-col': !(isGridLayout$ | async) }"
    (onDetectNodes)="pagesStateService.selectPages($event)"
  >
    <drop-zone
      *ngFor="let page of pageService.pages$ | async; let i = index"
      [ngClass]="{ 'w-full': !(isGridLayout$ | async) }"
      [disabled]="
        page._id === pagesDragAndDropService.dropzoneId ||
        (pagesDragAndDropService.draggableItemData &&
          pageService.isPageGroup(pagesDragAndDropService.draggableItemData))
      "
      (onDrop)="dropActionsPageGroupService.getActionPerformed(page)"
    >
      <draggable-item
        [isDraggable]="!(pagesStateService.pagesLength$ | async)"
        [id]="page._id"
        [gosthImgUrl]="'assets/file-link.png'"
        (onDragStart)="pagesDragAndDropService.handleDragStart(page._id, page)"
      >
        <selectable-card
          (hasHover)="cardHasHover = $event ? i : undefined"
          [selected]="pagesStateService.isSelected(i)"
          (onSelect)="pagesStateService.selectPage(i)"
          (onUnSelect)="pagesStateService.unSelectPage(i)"
        >
          <page-card [small]="!(isGridLayout$ | async)">
            <page-card-body
              [small]="!(isGridLayout$ | async)"
              [page]="page"
              body
            ></page-card-body>
            <page-card-actions
              *ngIf="
                !(pagesStateService.pagesLength$ | async) &&
                (cardHasHover === i || !!(isGridLayout$ | async))
              "
              [collapsed]="!!(isGridLayout$ | async)"
              actions
            ></page-card-actions>
          </page-card>
        </selectable-card>
      </draggable-item>
    </drop-zone>
  </drag-select-container>
</div>
